<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="AI日语会话搭子 — 跟小樱聊天。场景会话练习、生词自动收集、语音朗读。">
<meta name="theme-color" content="#0f0f0f">
<!-- iOS PWA -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="日语聊天">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!-- Splash Screen (iOS) -->
<link rel="apple-touch-startup-image" href="apple-touch-icon.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)">
<link rel="manifest" href="manifest.json">
<title>日语聊天</title>
<link rel="stylesheet" href="style.css?v=fix11">
</head>
<body>

<header>
  <button class="hdr-btn" id="scene-btn">💬 <span id="scene-label">自由聊天</span></button>
  <h1>🎌 跟小樱聊天</h1>
  <div class="sub">AI 日语会话搭子 <span style="opacity:.5">v11</span></div>
  <button class="hdr-btn" id="vocab-btn">📓 生词<span class="badge" id="vocab-badge">0</span></button>
  <button class="hdr-btn" id="rescue-btn">🆘 救急短语</button>
  <button class="hdr-btn" id="quiz-btn">📝 翻译练习</button>
</header>

<!-- 模式切换 + 难度选择 -->
<div id="mode-bar">
  <span class="mode-chip active" data-mode="chat">💬 聊天</span>
  <span class="mode-chip" data-mode="correct">📝 批改</span>
  <span class="mode-chip" data-mode="translate">🔄 翻译</span>
  <span class="mode-chip" data-mode="word">📖 查词</span>
  <select id="level-select">
    <option value="N5">N5</option>
    <option value="N4" selected>N4</option>
    <option value="N3">N3</option>
    <option value="N2">N2</option>
    <option value="N1">N1</option>
  </select>
  <span id="level-hint" title="当前难度下小樱的说话特征"></span>
  <select id="speed-select" title="语速">
    <option value="-50%">🐢 0.5x</option>
    <option value="-25%">🐇 0.75x</option>
    <option value="" selected>🚶 1.0x</option>
    <option value="+25%">🏃 1.25x</option>
    <option value="+50%">💨 1.5x</option>
  </select>
  <select id="tone-select" title="说话风格">
    <option value="polite" selected>😊 敬语</option>
    <option value="casual">😎 随意</option>
    <option value="kansai">🐙 关西话</option>
  </select>
  <button class="mode-chip tool-btn" id="call-btn" title="语音通话模式：全屏免提对话，像打电话一样"><span class="ico">📞</span>通话</button>
  <button class="mode-chip tool-btn" id="listening-toggle" title="听力模式：只听不读"><span class="ico">🔇</span>只听</button>
  <button class="mode-chip tool-btn" id="handsfree-btn" title="免提对话：自动 听→说→听 循环"><span class="ico">🎧</span>免提</button>
  <button class="mode-chip tool-btn" id="mute-btn" title="静音/取消静音"><span class="ico">🔊</span>声音</button>
  <button class="mode-chip tool-btn" id="lang-toggle-btn" title="语音识别语言切换"><span class="ico">🇯🇵</span>识别</button>
  <button class="mode-chip tool-btn" id="clear-history-btn" title="清空对话历史"><span class="ico">🗑</span>清空</button>
</div>

<div id="chat">
  <div class="msg ai">
    こんにちは！さくらです🌸<br>今日は何について話しましょうか？
    <div class="time">小樱（你好！我是小樱，今天想聊什么？）</div>
  </div>
</div>

<div id="status"></div>

<!-- 实时修正条 -->
<div id="correction-bar" class="hidden">
  <button id="correction-close">×</button>
  <div id="correction-content"></div>
</div>

<div id="input-area">
  <button class="btn" id="mic-btn" title="语音输入">🎤</button>
  <textarea id="input-box" rows="1" placeholder="用日语或中文跟我说话…"></textarea>
  <button class="btn" id="send-btn" title="发送">➤</button>
</div>

<div id="notice"></div>

<!-- 场景选择弹层 -->
<div class="sheet hidden" id="scene-sheet">
  <div class="sheet-box">
    <div class="sheet-title">
      <span>🎭 选择场景</span>
      <button class="sheet-close" data-close="scene-sheet">×</button>
    </div>
    <div class="scene-grid" id="scene-grid"></div>
  </div>
</div>

<!-- 生词本弹层 -->
<div class="sheet hidden" id="vocab-sheet">
  <div class="sheet-box">
    <div class="sheet-title">
      <span>📓 生词本</span>
      <button class="sheet-close" data-close="vocab-sheet">×</button>
    </div>
    <div id="vocab-days"></div>
    <div id="vocab-list"></div>
    <div class="vocab-actions">
      <button id="vocab-export" class="primary">⬇ 导出到 Anki</button>
      <button id="vocab-clear">🗑 清空</button>
    </div>
  </div>
</div>

<!-- 救急短语弹层 -->
<div class="sheet hidden" id="rescue-sheet">
  <div class="sheet-box">
    <div class="sheet-title">
      <span>🆘 救急短语</span>
      <button class="sheet-close" data-close="rescue-sheet">×</button>
    </div>
    <div class="rescue-grid" id="rescue-grid"></div>
  </div>
</div>

<!-- 翻译练习弹层 -->
<div class="sheet hidden" id="quiz-sheet">
  <div class="sheet-box quiz-box">
    <div class="sheet-title">
      <span>📝 翻译练习</span>
      <button class="sheet-close" data-close="quiz-sheet">×</button>
    </div>
    <!-- 方向 + 难度 -->
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap">
      <button id="quiz-direction" class="quiz-toggle">🇯🇵 → 🇨🇳</button>
      <select id="quiz-level" style="background:#2a2a2a;border:1px solid #333;color:var(--text-dim);border-radius:14px;padding:5px 10px;font-size:12px;font-family:inherit">
        <option value="all">全难度</option>
        <option value="1">N5</option>
        <option value="2" selected>N4</option>
        <option value="3">N3</option>
        <option value="4">N2</option>
        <option value="5">N1</option>
      </select>
      <span style="font-size:12px;color:var(--text-dim);margin-left:auto" id="quiz-progress"></span>
    </div>
    <!-- 进度条 -->
    <div class="quiz-bar-track"><div class="quiz-bar-fill" id="quiz-bar-fill"></div></div>
    <!-- 题目卡片 -->
    <div class="quiz-card" id="quiz-card">
      <div class="quiz-question-label">请翻译：</div>
      <div class="quiz-question" id="quiz-question"></div>
      <input type="text" id="quiz-input" placeholder="输入答案…" autocomplete="off">
      <button id="quiz-check" class="quiz-check-btn">✅ 確認</button>
      <div class="quiz-feedback hidden" id="quiz-feedback"></div>
    </div>
    <!-- 结果 -->
    <div class="quiz-result hidden" id="quiz-result">
      <div style="font-size:48px;margin-bottom:8px" id="quiz-result-emoji"></div>
      <div id="quiz-result-text"></div>
      <button id="quiz-restart" class="quiz-restart-btn">🔄 再来一次</button>
    </div>
  </div>
</div>

<!-- 量词专项弹层 -->
<div class="sheet hidden" id="counter-sheet">
  <div class="sheet-box">
    <div class="sheet-title">
      <span>🔢 量词练习</span>
      <button class="sheet-close" data-close="counter-sheet">×</button>
    </div>
    <div id="counter-progress" style="font-size:13px;color:var(--text-dim);margin-bottom:10px"></div>
    <div class="counter-card" id="counter-card">
      <div class="counter-question" id="counter-q"></div>
      <div class="counter-hint" id="counter-hint"></div>
      <input type="text" id="counter-input" placeholder="输入量词…" autocomplete="off">
      <button id="counter-check" class="quiz-check-btn">✅ 確認</button>
      <div class="quiz-feedback hidden" id="counter-feedback"></div>
    </div>
    <div class="quiz-result hidden" id="counter-result">
      <div style="font-size:48px;margin-bottom:8px" id="counter-result-emoji"></div>
      <div id="counter-result-text"></div>
      <button id="counter-restart" class="quiz-restart-btn">🔄 再来一次</button>
    </div>
  </div>
</div>

<!-- 划选查词弹窗 -->
<div class="word-popup hidden" id="word-popup">
  <div id="word-popup-content"></div>
  <button id="word-popup-close" class="sheet-close">×</button>
</div>

<!-- 访问口令输入界面 -->
<div id="auth-overlay">
  <div class="auth-box">
    <div style="font-size:44px;margin-bottom:12px">🔒</div>
    <p style="margin-bottom:16px;color:var(--text-dim);font-size:14px">请输入访问口令</p>
    <!-- 包在 form 里：iPhone 键盘会显示「前往/go」键，按下直接提交，
         不用非点 OK 按钮（iOS 输入法下 keydown 的 Enter 经常不触发） -->
    <form id="auth-form">
      <input type="password" id="auth-input" placeholder="口令" autocomplete="off" enterkeyhint="go">
      <button id="auth-btn" type="submit" class="btn" style="width:auto;border-radius:18px;padding:0 28px;height:40px;font-size:15px;margin-top:12px;background:var(--accent);color:#fff">OK</button>
    </form>
    <div id="auth-error"></div>
    <!-- 服务器设置（⚙ 图标开关） -->
    <div style="margin-top:16px;border-top:1px solid #333;padding-top:12px">
      <span id="server-toggle" style="cursor:pointer;color:var(--text-dim);font-size:13px">⚙ 服务器设置</span>
      <div id="server-config" style="display:none;margin-top:8px">
        <input type="text" id="server-input" placeholder="http://192.168.x.x:8765" autocomplete="off" style="width:100%;margin-bottom:6px">
        <button id="server-save" class="btn" style="width:auto;border-radius:14px;padding:0 16px;height:30px;font-size:12px;background:#444;color:#ccc">保存</button>        <span id="server-msg" style="font-size:11px;color:#4a4;margin-left:8px"></span>
      </div>
    </div>
  </div>
</div>

<!-- 语音通话模式（全屏） -->
<div id="call-overlay" class="hidden">
  <div class="call-screen">
    <!-- 顶部：名字 + 状态 + 通话计时 -->
    <div class="call-header">
      <div class="call-name">さくら <span class="call-dot"></span></div>
      <div class="call-status" id="call-status">通话中</div>
      <div class="call-timer" id="call-timer">00:00</div>
    </div>
    <!-- 中部：头像 + 波形 + 提示 -->
    <div class="call-main">
      <div class="call-avatar" id="call-avatar">🌸</div>
      <div class="call-wave" id="call-wave">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
      <div class="call-hint" id="call-hint">直接说话即可，小樱会回应你</div>
    </div>
    <!-- 实时字幕（你 / 小樱，双语：原文 + 中文翻译） -->
    <div class="call-caption">
      <div class="call-caption-user hidden" id="call-user-text"></div>
      <div class="call-caption-trans hidden" id="call-user-trans"></div>
      <div class="call-caption-ai" id="call-ai-text">こんにちは！さくらです🌸</div>
      <div class="call-caption-trans hidden" id="call-ai-trans"></div>
    </div>
    <!-- 底部控制 -->
    <div class="call-controls">
      <button class="call-btn" id="call-save" title="通话记录：保存/不保存">💾</button>
      <button class="call-btn" id="call-mute" title="静音/取消静音">🔊</button>
      <button class="call-btn hangup" id="call-hangup" title="挂断通话">📞</button>
      <button class="call-btn" id="call-lang" title="语音识别语言切换">🇯🇵</button>
    </div>
  </div>
</div>

<script src="app.js?v=fix14"></script>
</body>
</html>
