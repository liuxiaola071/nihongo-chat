<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="日本語">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎌</text></svg>">
<title>日本語チャット</title>
<style>
:root{
  --bg: #0f0f0f;
  --surface: #1a1a1a;
  --bubble-me: #e8304a;
  --bubble-ai: #2a2a2a;
  --text: #eee;
  --text-dim: #999;
  --accent: #ff6b7a;
  --safe-bottom: env(safe-area-inset-bottom, 12px);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family: -apple-system, 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
}

/* header */
header{
  background: var(--surface);
  padding: 14px 16px;
  text-align: center;
  border-bottom: 1px solid #333;
  flex-shrink: 0;
}
header h1{font-size: 18px;font-weight: 600}
header .sub{font-size: 11px;color:var(--text-dim);margin-top:2px}

/* chat area */
#chat{
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  -webkit-overflow-scrolling: touch;
}
.msg{
  max-width: 82%;
  padding: 12px 16px;
  border-radius: 18px;
  font-size: 15px;
  line-height: 1.55;
  word-break: break-word;
  animation: fadeUp .3s ease-out;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg.me{
  align-self: flex-end;
  background: var(--bubble-me);
  border-bottom-right-radius: 6px;
}
.msg.ai{
  align-self: flex-start;
  background: var(--bubble-ai);
  border-bottom-left-radius: 6px;
}
.msg .time{
  font-size: 10px;
  color: var(--text-dim);
  margin-top: 4px;
  text-align: right;
}
.msg.ai .time{text-align:left}
.msg .play-btn{
  display: inline-block;
  margin-top: 6px;
  font-size: 13px;
  color: var(--accent);
  cursor: pointer;
  padding: 4px 10px;
  border: 1px solid var(--accent);
  border-radius: 14px;
  background: transparent;
}

/* typing indicator */
.typing{
  align-self: flex-start;
  padding: 14px 20px;
  border-radius: 18px;
  background: var(--bubble-ai);
  display: flex;
  gap: 4px;
}
.typing span{
  width: 7px;height: 7px;
  border-radius: 50%;
  background: var(--text-dim);
  animation: bounce 1.2s infinite;
}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-8px)}}

/* bottom bar */
#input-area{
  flex-shrink: 0;
  background: var(--surface);
  padding: 10px 12px calc(10px + var(--safe-bottom));
  display: flex;
  align-items: flex-end;
  gap: 8px;
  border-top: 1px solid #333;
}
#input-box{
  flex:1;
  background: #2a2a2a;
  border: 1px solid #444;
  border-radius: 22px;
  padding: 10px 16px;
  color: var(--text);
  font-size: 15px;
  resize: none;
  outline: none;
  font-family: inherit;
  max-height: 100px;
  line-height: 1.4;
}
#input-box::placeholder{color:#666}
.btn{
  width: 44px;height: 44px;
  border-radius: 50%;
  border: none;
  font-size: 20px;
  cursor: pointer;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform .15s;
}
.btn:active{transform:scale(.9)}
#mic-btn{
  background: #333;
  color: var(--text);
}
#mic-btn.listening{
  background: var(--accent);
  color: #fff;
  animation: pulse 1s infinite;
}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,107,122,.4)}50%{box-shadow:0 0 0 12px rgba(255,107,122,0)}}
#send-btn{
  background: var(--accent);
  color: #fff;
}
#status{font-size:11px;color:var(--text-dim);text-align:center;padding:4px 0;min-height:20px}

/* overlay notice */
#notice{
  position: fixed;
  bottom: 100px;
  left: 50%;
  transform: translateX(-50%);
  background: #333;
  color: #fff;
  padding: 8px 18px;
  border-radius: 20px;
  font-size: 13px;
  z-index: 99;
  opacity: 0;
  transition: opacity .25s;
  pointer-events: none;
}
#notice.show{opacity: 1}
</style>
</head>
<body>

<header>
  <h1>🎌 さくらと話そう</h1>
  <div class="sub">AI日本語会話パートナー</div>
</header>

<div id="chat">
  <div class="msg ai">
    こんにちは！さくらです🌸<br>今日は何について話しましょうか？
    <div class="time">さくら</div>
  </div>
</div>

<div id="status"></div>

<div id="input-area">
  <button class="btn" id="mic-btn" title="音声入力">🎤</button>
  <textarea id="input-box" rows="1" placeholder="日本語で話しかけてね…"></textarea>
  <button class="btn" id="send-btn" title="送信">➤</button>
</div>

<div id="notice"></div>

<script>
// ==================== 配置 ====================
const API = '/api/chat';

// ==================== DOM ====================
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('input-box');
const sendBtn = document.getElementById('send-btn');
const micBtn = document.getElementById('mic-btn');
const statusEl = document.getElementById('status');
const noticeEl = document.getElementById('notice');

// ==================== 工具函数 ====================
function scrollBottom() {
  chatEl.scrollTop = chatEl.scrollHeight;
}

function showNotice(text, duration = 2000) {
  noticeEl.textContent = text;
  noticeEl.classList.add('show');
  setTimeout(() => noticeEl.classList.remove('show'), duration);
}

function now() {
  const d = new Date();
  return `${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
}

// 把文字里的 < > & " 转义掉，防止别人塞 HTML/脚本进来
function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// ==================== 消息渲染 ====================
// 缓存每条 AI 回复的语音，重听时直接播，不再花钱重新生成
const audioCache = new Map();
let audioSeq = 0;

function addMsg(role, text, withAudio = false, audioB64 = null) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;

  let html = escapeHtml(text).replace(/\n/g, '<br>');

  if (role === 'ai' && withAudio && audioB64) {
    const id = `audio-${audioSeq++}`;
    audioCache.set(id, audioB64);
    html += `<br><span class="play-btn" data-audio-id="${id}">🔊 もう一度聞く</span>`;
  }

  const label = role === 'me' ? now() : 'さくら';
  html += `<div class="time">${escapeHtml(label)}</div>`;
  div.innerHTML = html;

  chatEl.appendChild(div);
  scrollBottom();
  return div;
}

function showTyping() {
  const div = document.createElement('div');
  div.className = 'typing';
  div.id = 'typing-indicator';
  div.innerHTML = '<span></span><span></span><span></span>';
  chatEl.appendChild(div);
  scrollBottom();
}

function hideTyping() {
  const el = document.getElementById('typing-indicator');
  if (el) el.remove();
}

// ==================== 播放语音 ====================
let audioCtx = null;

function playAudio(base64) {
  if (!base64) return;
  try {
    const binary = atob(base64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);

    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    // iPhone 上切后台再回来 audioCtx 会被挂起，需要唤醒
    if (audioCtx.state === 'suspended') audioCtx.resume();

    audioCtx.decodeAudioData(bytes.buffer, (buffer) => {
      const source = audioCtx.createBufferSource();
      source.buffer = buffer;
      source.connect(audioCtx.destination);
      source.start(0);
    });
  } catch (e) {
    console.error('Audio play error:', e);
  }
}

// 点击"再听一次" — 直接播缓存的语音，不重新调 AI
chatEl.addEventListener('click', (e) => {
  if (e.target.classList.contains('play-btn')) {
    const id = e.target.dataset.audioId;
    const cached = audioCache.get(id);
    if (cached) {
      playAudio(cached);
    } else {
      showNotice('音声が見つかりません');
    }
  }
});

// ==================== 语音识别 ====================
let recognition = null;
let isListening = false;

function initSpeech() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    micBtn.style.display = 'none';
    showNotice('このブラウザは音声入力をサポートしていません');
    return;
  }

  recognition = new SpeechRecognition();
  recognition.lang = 'ja-JP';
  recognition.interimResults = true;
  recognition.continuous = false;
  recognition.maxAlternatives = 1;

  recognition.onresult = (event) => {
    let transcript = '';
    for (let i = 0; i < event.results.length; i++) {
      transcript += event.results[i][0].transcript;
    }
    inputEl.value = transcript;
    // 如果是最终结果，自动发送
    if (event.results[0].isFinal && transcript.trim()) {
      setTimeout(() => sendMessage(), 300);
    }
  };

  recognition.onerror = (event) => {
    console.error('Speech error:', event.error);
    stopListening();
    if (event.error === 'not-allowed') {
      showNotice('マイクの許可が必要です');
    } else if (event.error === 'no-speech') {
      showNotice('音声が検出されませんでした');
    }
  };

  recognition.onend = () => stopListening();
}

function startListening() {
  if (!recognition) return;
  try {
    isListening = true;
    micBtn.classList.add('listening');
    statusEl.textContent = '🎤 聞いています…';
    recognition.start();
  } catch (e) {
    stopListening();
  }
}

function stopListening() {
  isListening = false;
  micBtn.classList.remove('listening');
  statusEl.textContent = '';
}

micBtn.addEventListener('click', () => {
  if (!recognition) {
    showNotice('音声入力非対応です。キーボードで入力してください');
    return;
  }
  if (isListening) {
    recognition.stop();
    stopListening();
  } else {
    startListening();
  }
});

// ==================== 发送消息 ====================
let isSending = false;   // 防止连点发送两次

async function sendToAI(text) {
  if (isSending) return;
  isSending = true;
  sendBtn.disabled = true;

  statusEl.textContent = 'さくらが考え中…';
  addMsg('me', text);
  showTyping();

  try {
    const resp = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text }),
    });

    if (!resp.ok) {
      // 后端返回的错误原因（比如字数超限）读出来给用户看
      let msg = `HTTP ${resp.status}`;
      try {
        const errData = await resp.json();
        if (errData.detail) msg = errData.detail;
      } catch (_) {}
      throw new Error(msg);
    }

    const data = await resp.json();
    hideTyping();

    addMsg('ai', data.reply, true, data.audio_b64);

    // 自动播放语音
    if (data.audio_b64) {
      playAudio(data.audio_b64);
    }

    statusEl.textContent = '';
  } catch (err) {
    hideTyping();
    statusEl.textContent = '';
    showNotice('エラー: ' + err.message, 3000);
    console.error(err);
  } finally {
    isSending = false;
    sendBtn.disabled = false;
  }
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;
  if (isSending) {
    showNotice('ちょっと待ってね…');
    return;
  }

  inputEl.value = '';
  inputEl.style.height = 'auto';
  stopListening();

  await sendToAI(text);
}

// ==================== 事件绑定 ====================
sendBtn.addEventListener('click', sendMessage);

inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

// 自动调整输入框高度
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 100) + 'px';
});

// ==================== 初始化 ====================
initSpeech();
scrollBottom();

// PWA 离线支持
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
