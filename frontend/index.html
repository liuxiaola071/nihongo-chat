<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="description" content="AI日本語会話パートナー — さくらと話そう。シーン別会話練習・生詞自動収集・音声読み上げ対応。">
<meta name="theme-color" content="#0f0f0f">
<!-- iOS PWA -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="日本語">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!-- Splash Screen (iOS) -->
<link rel="apple-touch-startup-image" href="apple-touch-icon.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)">
<link rel="manifest" href="manifest.json">
<title>日本語チャット</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <button class="hdr-btn" id="scene-btn">💬 <span id="scene-label">自由聊天</span></button>
  <h1>🎌 さくらと話そう</h1>
  <div class="sub">AI日本語会話パートナー</div>
  <button class="hdr-btn" id="vocab-btn">📓 単語<span class="badge" id="vocab-badge">0</span></button>
  <button class="hdr-btn" id="review-btn">📝 復習<span class="badge" id="review-badge">0</span></button>
  <button class="hdr-btn" id="rescue-btn">🆘 救急</button>
  <button class="hdr-btn" id="quiz-btn">📝 練習</button>
</header>

<!-- 模式切换 + 难度选择 -->
<div id="mode-bar">
  <span class="mode-chip active" data-mode="chat">💬 会話</span>
  <span class="mode-chip" data-mode="correct">📝 添削</span>
  <span class="mode-chip" data-mode="translate">🔄 翻訳</span>
  <span class="mode-chip" data-mode="word">📖 辞書</span>
  <select id="level-select">
    <option value="N5">N5</option>
    <option value="N4" selected>N4</option>
    <option value="N3">N3</option>
    <option value="N2">N2</option>
    <option value="N1">N1</option>
  </select>
  <select id="speed-select" title="語速">
    <option value="-50%">🐢 0.5x</option>
    <option value="-25%">🐇 0.75x</option>
    <option value="" selected>🚶 1.0x</option>
    <option value="+25%">🏃 1.25x</option>
    <option value="+50%">💨 1.5x</option>
  </select>
  <select id="tone-select" title="話し方">
    <option value="polite" selected>😊 敬語</option>
    <option value="casual">😎 タメ口</option>
    <option value="kansai">🐙 関西弁</option>
  </select>
  <button class="mode-chip" id="listening-toggle" title="听力模式：只听不说">🔇</button>
  <button class="mode-chip" id="handsfree-btn" title="免提对话：自动 听→说→听 循环">🎧</button>
  <button class="mode-chip" id="mute-btn" title="静音/取消静音">🔊</button>
  <button class="mode-chip" id="lang-toggle-btn" title="语音识别语言切换">🇯🇵</button>
  <button class="mode-chip" id="export-btn" title="导出对话">📥</button>
  <button class="mode-chip" id="stats-btn" title="学习统计">📊</button>
</div>

<div id="chat">
  <div class="msg ai">
    こんにちは！さくらです🌸<br>今日は何について話しましょうか？
    <div class="time">さくら</div>
  </div>
</div>

<div id="status"></div>

<!-- 实时修正条 -->
<div id="correction-bar" class="hidden">
  <button id="correction-close">×</button>
  <div id="correction-content"></div>
</div>

<div id="input-area">
  <button class="btn" id="mic-btn" title="音声入力">🎤</button>
  <textarea id="input-box" rows="1" placeholder="日本語で話しかけてね…"></textarea>
  <button class="btn" id="send-btn" title="送信">➤</button>
</div>

<div id="notice"></div>

<!-- 场景选择弹层 -->
<div class="sheet hidden" id="scene-sheet">
  <div class="sheet-box">
    <div class="sheet-title">
      <span>🎭 シーンを選ぶ</span>
      <button class="sheet-close" data-close="scene-sheet">×</button>
    </div>
    <div class="scene-grid" id="scene-grid"></div>
  </div>
</div>

<!-- 生词本弹层 -->
<div class="sheet hidden" id="vocab-sheet">
  <div class="sheet-box">
    <div class="sheet-title">
      <span>📓 単語帳</span>
      <button class="sheet-close" data-close="vocab-sheet">×</button>
    </div>
    <div id="vocab-days"></div>
    <div id="vocab-list"></div>
    <div class="vocab-actions">
      <button id="vocab-export" class="primary">⬇ Ankiに書き出す</button>
      <button id="vocab-clear">🗑 クリア</button>
    </div>
  </div>
</div>

<!-- 救急短语弹层 -->
<div class="sheet hidden" id="rescue-sheet">
  <div class="sheet-box">
    <div class="sheet-title">
      <span>🆘 緊急フレーズ</span>
      <button class="sheet-close" data-close="rescue-sheet">×</button>
    </div>
    <div class="rescue-grid" id="rescue-grid"></div>
  </div>
</div>

<!-- SRS 复习弹层 -->
<div class="sheet hidden" id="review-sheet">
  <div class="sheet-box review-box">
    <div class="sheet-title">
      <span>📝 間隔復習</span>
      <button class="sheet-close" data-close="review-sheet">×</button>
    </div>
    <div class="review-stats" id="review-stats"></div>
    <div class="review-card" id="review-card">
      <div class="review-front">
        <div class="review-word" id="review-word"></div>
        <div class="review-kana" id="review-kana"></div>
      </div>
      <div class="review-back hidden" id="review-back">
        <div class="review-meaning" id="review-meaning"></div>
      </div>
    </div>
    <div class="review-hint" id="review-hint">👆 タップで答えを見る</div>
    <div class="review-grades" id="review-grades">
      <button class="grade-btn" data-q="0">😰 全然<br>ダメ</button>
      <button class="grade-btn" data-q="1">😣 忘れた</button>
      <button class="grade-btn" data-q="2">🤔 見覚え<br>ある</button>
      <button class="grade-btn" data-q="3">😅 難しい<br>けど正解</button>
      <button class="grade-btn" data-q="4">😊 少し<br>迷った</button>
      <button class="grade-btn" data-q="5">😎 完璧</button>
    </div>
    <div class="review-done hidden" id="review-done">
      <div style="font-size:48px;margin-bottom:12px">🎉</div>
      <p>今日の復習は全部終わりました！</p>
      <p style="color:var(--text-dim);font-size:14px">また明日、さくらが待ってるよ 🌸</p>
    </div>
  </div>
</div>

<!-- 翻译练习弹层 -->
<div class="sheet hidden" id="quiz-sheet">
  <div class="sheet-box quiz-box">
    <div class="sheet-title">
      <span>📝 翻訳練習</span>
      <button class="sheet-close" data-close="quiz-sheet">×</button>
    </div>
    <!-- 方向 + 难度 -->
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap">
      <button id="quiz-direction" class="quiz-toggle">🇯🇵 → 🇨🇳</button>
      <select id="quiz-level" style="background:#2a2a2a;border:1px solid #333;color:var(--text-dim);border-radius:14px;padding:5px 10px;font-size:12px;font-family:inherit">
        <option value="all">全レベル</option>
        <option value="1">N5</option>
        <option value="2" selected>N4</option>
        <option value="3">N3</option>
        <option value="4">N2</option>
        <option value="5">N1</option>
      </select>
      <span style="font-size:12px;color:var(--text-dim);margin-left:auto" id="quiz-progress"></span>
    </div>
    <!-- 进度条 -->
    <div class="quiz-bar-track"><div class="quiz-bar-fill" id="quiz-bar-fill"></div></div>
    <!-- 题目卡片 -->
    <div class="quiz-card" id="quiz-card">
      <div class="quiz-question-label">翻訳してください：</div>
      <div class="quiz-question" id="quiz-question"></div>
      <input type="text" id="quiz-input" placeholder="答えを入力…" autocomplete="off">
      <button id="quiz-check" class="quiz-check-btn">✅ 確認</button>
      <div class="quiz-feedback hidden" id="quiz-feedback"></div>
    </div>
    <!-- 结果 -->
    <div class="quiz-result hidden" id="quiz-result">
      <div style="font-size:48px;margin-bottom:8px" id="quiz-result-emoji"></div>
      <div id="quiz-result-text"></div>
      <button id="quiz-restart" class="quiz-restart-btn">🔄 もう一度</button>
    </div>
  </div>
</div>

<!-- 错误本弹层 -->
<div class="sheet hidden" id="errors-sheet">
  <div class="sheet-box">
    <div class="sheet-title">
      <span>📕 ミス帳</span>
      <button class="sheet-close" data-close="errors-sheet">×</button>
    </div>
    <div id="errors-stats" style="margin-bottom:12px;font-size:13px;color:var(--text-dim)"></div>
    <div id="errors-list"></div>
    <div class="vocab-actions" style="margin-top:12px">
      <button id="errors-clear">🗑 全部クリア</button>
    </div>
  </div>
</div>

<!-- 学习统计弹层 -->
<div class="sheet hidden" id="stats-sheet">
  <div class="sheet-box">
    <div class="sheet-title">
      <span>📊 学習統計</span>
      <button class="sheet-close" data-close="stats-sheet">×</button>
    </div>
    <div id="stats-content"></div>
  </div>
</div>

<!-- 量词专项弹层 -->
<div class="sheet hidden" id="counter-sheet">
  <div class="sheet-box">
    <div class="sheet-title">
      <span>🔢 助数詞ドリル</span>
      <button class="sheet-close" data-close="counter-sheet">×</button>
    </div>
    <div id="counter-progress" style="font-size:13px;color:var(--text-dim);margin-bottom:10px"></div>
    <div class="counter-card" id="counter-card">
      <div class="counter-question" id="counter-q"></div>
      <div class="counter-hint" id="counter-hint"></div>
      <input type="text" id="counter-input" placeholder="助数詞を入力…" autocomplete="off">
      <button id="counter-check" class="quiz-check-btn">✅ 確認</button>
      <div class="quiz-feedback hidden" id="counter-feedback"></div>
    </div>
    <div class="quiz-result hidden" id="counter-result">
      <div style="font-size:48px;margin-bottom:8px" id="counter-result-emoji"></div>
      <div id="counter-result-text"></div>
      <button id="counter-restart" class="quiz-restart-btn">🔄 もう一度</button>
    </div>
  </div>
</div>

<!-- 划选查词弹窗 -->
<div class="word-popup hidden" id="word-popup">
  <div id="word-popup-content"></div>
  <button id="word-popup-close" class="sheet-close">×</button>
</div>

<!-- 访问口令输入界面 -->
<div id="auth-overlay">
  <div class="auth-box">
    <div style="font-size:44px;margin-bottom:12px">🔒</div>
    <p style="margin-bottom:16px;color:var(--text-dim);font-size:14px">パスワードを入力してください</p>
    <input type="password" id="auth-input" placeholder="パスワード" autocomplete="off">
    <button id="auth-btn" class="btn" style="width:auto;border-radius:18px;padding:0 28px;height:40px;font-size:15px;margin-top:12px;background:var(--accent);color:#fff">OK</button>
    <div id="auth-error"></div>
    <!-- サーバー設定（⚙ アイコンで開閉） -->
    <div style="margin-top:16px;border-top:1px solid #333;padding-top:12px">
      <span id="server-toggle" style="cursor:pointer;color:var(--text-dim);font-size:13px">⚙ サーバー設定</span>
      <div id="server-config" style="display:none;margin-top:8px">
        <input type="text" id="server-input" placeholder="http://192.168.x.x:8765" autocomplete="off" style="width:100%;margin-bottom:6px">
        <button id="server-save" class="btn" style="width:auto;border-radius:14px;padding:0 16px;height:30px;font-size:12px;background:#444;color:#ccc">保存</button>
        <span id="server-msg" style="font-size:11px;color:#4a4;margin-left:8px"></span>
      </div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
